      ;(function () {
        var key = 'vo-theme'
        var stored = null
        try {
          stored = localStorage.getItem(key)
        } catch (e) {}
        var theme = stored || 'system'
        var resolved = theme
        if (theme === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.setAttribute('data-theme', resolved)
      })()
